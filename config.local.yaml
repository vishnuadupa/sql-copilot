model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05

training:
  output_dir: "./qwen-sql-lora-local"
  # Separate Hub repo — must never be the same as config.yaml's
  # hub_model_id if both trainings can run at the same time, or their
  # checkpoint pushes will interleave and corrupt each other remotely.
  hub_model_id: "vishnuadupa/qwen-sql-lora-local"
  epochs: 3
  # batch_size=1 with grad_accum=8 keeps the SAME effective batch size (8)
  # and therefore the same total step count / LR schedule as the Colab
  # run (config.yaml), just spread over more, smaller forward/backward
  # passes — needed to fit a 4GB GPU (GTX 1650). Raise batch_size only if
  # you've confirmed no OOM at 1 first.
  batch_size: 1
  gradient_accumulation_steps: 8
  lr: 0.0002
  save_steps: 50
  eval_steps: 50
  save_total_limit: 5

inference:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 512
