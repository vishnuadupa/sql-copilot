model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05

training:
  output_dir: "./qwen-sql-lora"
  hub_model_id: "vishnuadupa/qwen-sql-lora"
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 2
  lr: 0.0002
  save_steps: 100
  eval_steps: 100
  save_total_limit: 5

inference:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 512
